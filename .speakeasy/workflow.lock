    speakeasyVersion: 1.763.6
    sources:
        mistral-azure-source:
            inputs:
                - location: ../../openapi/specs/v2/azure-sdk.yaml
            output: ./packages/mistralai-azure/.speakeasy/azure.out.openapi.yaml
        mistral-google-cloud-source:
            inputs:
                - location: ../../openapi/specs/v2/google-cloud-sdk.yaml
            output: ./packages/mistralai-gcp/.speakeasy/gcp.out.openapi.yaml
        mistral-openapi:
            inputs:
                - location: ../../openapi/specs/v2/main-sdk.yaml
            output: .speakeasy/main.out.openapi.yaml
            registry:
                location: registry.speakeasyapi.dev/mistral-dev/mistral-dev/mistral-openapi
    targets:
        mistralai-azure-sdk:
            target: typescript
            source: mistral-azure-source
            output: ./packages/mistralai-azure
            publish:
                npm:
                    token: $npm_token
            codeSamples:
                registry:
                    location: registry.speakeasyapi.dev/mistral-dev/mistral-dev/mistral-openapi-azure-code-samples
                blocking: false
        mistralai-gcp-sdk:
            target: typescript
            source: mistral-google-cloud-source
