name: Publish MISTRALAI-GCP-SDK
permissions:
  contents: write
  id-token: write
"on":
  push:
    branches:
      - v1
    paths:
      - packages/mistralai-gcp/RELEASES.md
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Type 'publish' to confirm v2 release"
        required: true
jobs:
  publish:
    if: github.event_name == 'push' || github.event.inputs.confirm_publish == 'publish'
    runs-on: ubuntu-24.04
    environment:
      name: publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: packages/mistralai-gcp
        run: npx -y -p npm@11.15.0 npm install --ignore-scripts --min-release-age=7

      - name: Build package
        working-directory: packages/mistralai-gcp
        run: npm run build

      - name: Publish package to npm
        id: publish
        working-directory: packages/mistralai-gcp
        run: |
          VERSION=$(npm pkg get version | tr -d '"')
          echo "Detected version: $VERSION"

          if [[ "$VERSION" == *"-"* ]]; then
            PRERELEASE=${VERSION#*-}
            TAG=${PRERELEASE%%.*}
          else
            TAG="latest"
          fi

          echo "Staging under dist-tag: $TAG"
          npx -y -p npm@11.15.0 npm stage publish --tag "$TAG" --access public --provenance

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Creates the GitHub Release immediately after `npm stage publish`,
      # before the npm 2FA approval. If the staged package is rejected on
      # npmjs.com, also run:
      #   gh release delete <tag> --cleanup-tag --yes --repo mistralai/client-ts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail

          TAG="packages/mistralai-gcp/v${VERSION}"
          INVOKE_TIME=$(date -u '+%Y-%m-%d %H:%M:%S')

          BODY_FILE=$(mktemp)
          {
            printf '# Generated by Speakeasy CLI\n\n'
            if [ -f packages/mistralai-gcp/RELEASES.md ]; then
              awk '/^## /{buf=""} {buf=buf $0 "\n"} END{printf "%s", buf}' packages/mistralai-gcp/RELEASES.md
            fi
            printf '\nPublishing Completed\n'
          } > "$BODY_FILE"

          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "typescript - ${TAG} - ${INVOKE_TIME}" \
            --notes-file "$BODY_FILE" \
            $PRERELEASE_FLAG
